name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: Secret scan
        run: |
          if git grep -nE -e '-----BEGIN( [A-Z]+)? PRIVATE KEY-----|sk-(live|test)-[A-Za-z0-9]{10,}|sk_(live|test)_[A-Za-z0-9]{16,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,}|ghr_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|re_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9_-]{16,}|[0-9]{8,10}:[A-Za-z0-9_-]{35,}|AKIA[0-9A-Z]{16}|IT[0-9]{2}[A-Z][0-9]{22}' -- . ':!package-lock.json' ':!*.example'; then
            echo 'secret scan found matches' >&2
            exit 1
          fi
          if git ls-files | grep -E '(\.env\.local$|\.pem$|\.key$|\.p12$|\.pfx$|^diagnostics/)'; then
            echo 'secret-bearing files are tracked' >&2
            exit 1
          fi
